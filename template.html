<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light" } catch {}</script>
<style>
/* 預設深色（不跟系統），右上角按鈕可切到淺色並記住 */
:root {
  color-scheme: dark;
  --bg: #15130f; --panel: #1d1a15; --line: #2e2a22; --text: #ece5d6; --muted: #8f8674;
  --accent: #e0a458; --accent-soft: #3a2d1b; --good: #7fbf8c; --stale: #5d564a;
}
:root[data-theme="light"] {
  color-scheme: light;
  /* 低亮度暖灰，避免大面積近白色造成眼睛疲勞；文字對比皆 ≥ 4.5:1 */
  --bg: #e7e2d8; --panel: #efebe3; --line: #d3cbbc; --text: #2e2a24; --muted: #6b6255;
  --accent: #8c5017; --accent-soft: #e2d3bd; --good: #3f7a4b; --stale: #9a907f;
}
/* 主題開關：圖示框和圓鈕同樣大小、同樣位置（左 3px／右 3px，24×24），所以圖示一定在圓鈕正中心 */
.theme { position: relative; flex: none; width: 58px; height: 32px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; padding: 0; }
.theme:hover { border-color: var(--accent); }
.theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme .knob, .theme .ic { position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 50%; }
.theme .knob { left: 29px; background: var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .35); transition: left .2s ease; }
:root[data-theme="light"] .theme .knob { left: 3px; }
.theme .ic { z-index: 1; display: grid; place-items: center; color: var(--muted); transition: color .2s; }
.theme .ic svg { width: 14px; height: 14px; }
.theme .sun { left: 3px; } .theme .moon { right: 3px; }
/* 圓鈕所在那一側＝目前模式，圖示改深色顯示在圓鈕上 */
:root:not([data-theme="light"]) .theme .moon { color: #1a1408; }
:root[data-theme="light"] .theme .sun { color: #fff; }
:root[data-theme="light"] .chip[aria-pressed="true"], :root[data-theme="light"] .seg button[aria-pressed="true"], :root[data-theme="light"] .toast, :root[data-theme="light"] .clear:hover { color: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
h1 small { font-size: 15px; color: var(--muted); font-weight: 400; margin-left: 8px; letter-spacing: 0; }
.rate { display: flex; align-items: center; gap: 12px; font-size: 18px; font-variant-numeric: tabular-nums; }
#rate { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
#rate .pair { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#rate small { color: var(--muted); font-size: 13px; }
.rate b { color: var(--accent); }
.meta { width: 100%; color: var(--muted); font-size: 13px; }
.stamp { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.stamp b { font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stamp .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.stamp.old .dot { background: #d9534f; }
.stamp.old b { color: #e07a76; }
.stamp span { color: var(--muted); font-size: 13px; }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 9; background: var(--accent); color: #1a1408; padding: 8px 14px; border-radius: 8px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 220px; min-width: 0; display: flex; }
.bar input { flex: 1; min-width: 0; padding: 8px 40px 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
.bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.bar input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; } /* 用自己的清除鈕，各瀏覽器一致 */
.clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--line); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.clear[hidden] { display: none; }
.clear:hover { background: var(--accent); color: #1a1408; }
.clear svg { width: 12px; height: 12px; }
.ftoggle { display: none; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; width: 100%; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; height: 38px; padding: 0 10px 0 6px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; text-align: left; white-space: nowrap; overflow: hidden; }
.chip .ic { width: 50px; flex: none; display: flex; justify-content: center; gap: 2px; }
.chip img { width: 24px; height: 24px; object-fit: contain; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 700; }
@media (max-width: 600px) {
  .bar input { font-size: 16px; }
  .bar.compact { flex-wrap: nowrap; padding: 8px 0; box-shadow: 0 6px 12px rgb(0 0 0 / .25); }
  .bar.compact .search { flex: 1 1 0; }
  .bar.compact .ftoggle { display: flex; align-items: center; gap: 4px; flex: none; max-width: 46%; padding: 0 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar.compact .seg, .bar.compact .chips, .bar.compact .sorter { display: none; }
  .sorter { width: 100%; justify-content: space-between; }
  .sorter select { font-size: 16px; }
  .bar.compact.open { flex-wrap: wrap; max-height: 85vh; overflow-y: auto; }
  .bar.compact.open .seg, .bar.compact.open .sorter { display: flex; }
  .bar.compact.open .chips { display: grid; }
}
@media (max-width: 600px) { .chips { grid-template-columns: repeat(3, 1fr); } .chip { font-size: 13px; height: 34px; padding: 0 6px 0 2px; gap: 3px; } .chip .ic { width: 24px; } .chip img { width: 20px; height: 20px; } .chip img + img { display: none; } }
section { margin-top: 22px; }
h2 { font-size: 15px; margin: 0 0 8px; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
h3 { font-size: 15px; font-weight: 600; color: var(--text); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; letter-spacing: .02em; }
h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); flex: none; }
h3 small { font-size: 12px; font-weight: 400; color: var(--muted); }
h3::after { content: ""; flex: 1; border-top: 1px solid var(--line); order: 1; }
.sorter { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.sorter label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.sorter select { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 38px; cursor: pointer; }
.sorter select:hover, .sorter select:focus { border-color: var(--accent); outline: none; }
.grpchk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.grpchk:has(input:disabled) { opacity: .45; cursor: default; }
:root { --cw: 200px; --gap: 8px; }
.grps { display: flex; flex-wrap: wrap; column-gap: var(--gap); }
.grp { flex: none; min-width: 0; width: calc(var(--k, 1) * (var(--cw) + var(--gap)) - var(--gap)); }
.grp .grid { grid-template-columns: repeat(var(--k, 1), var(--cw)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, var(--cw)); gap: var(--gap); align-items: stretch; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; }
.card[open] { border-color: var(--accent); z-index: 3; border-radius: 10px 10px 0 0; }
.card summary { height: 100%; list-style: none; cursor: pointer; padding: 8px 10px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 8px; align-items: center; }
.card summary::-webkit-details-marker { display: none; }
.card summary:hover { background: var(--accent-soft); border-radius: 10px; }
.card summary > img { width: 34px; height: 34px; object-fit: contain; grid-row: span 2; }
.card .nm { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; } /* 名稱完整顯示（長名稱換行），紋身這類圖示相同的物品才分得出來 */
.card .px { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 15px; font-weight: 600; }
.card .px span { display: inline-flex; align-items: center; gap: 3px; }
.card .px .na { color: var(--stale); font-weight: 400; }
.card .px .stale { color: var(--stale); }
.card .px .out { color: var(--stale); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--stale) 70%, transparent); }
.card.soldout { opacity: .62; border-style: dashed; }
.card.notrade { opacity: .4; border-style: dashed; background: transparent; }
.card.notrade:hover, .card.notrade[open] { opacity: .85; }
.card.notrade .px .na { font-size: 12px; font-weight: 400; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--panel); color: var(--muted); font: inherit; font-size: 14px; padding: 0 14px; min-height: 38px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1a1408; font-weight: 700; }
.seg button small { margin-left: 6px; font-size: 12px; opacity: .75; font-weight: 400; }
.hotseg { display: inline-flex; margin-top: 18px; }
.hotseg button { min-height: 34px; font-size: 13px; }
@media (max-width: 600px) { .hotseg { display: flex; width: 100%; } }
.card.notrade.listed { opacity: .7; }
@media (max-width: 600px) { .seg { width: 100%; } .seg button { flex: 1; } }
.card.soldout:hover, .card.soldout[open] { opacity: 1; }
.tag { font-size: 11px; line-height: 1; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--stale); color: var(--muted); margin-left: 6px; vertical-align: 2px; font-weight: 400; }
.more .warn { color: var(--accent); }
.card .more { position: absolute; left: -1px; right: -1px; top: 100%; background: var(--panel); border: 1px solid var(--accent); border-top: 1px dashed var(--line); border-radius: 0 0 10px 10px; box-shadow: 0 10px 24px rgb(0 0 0 / .35); padding: 6px 10px 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.card .more b { color: var(--text); font-weight: 500; }
.card .more > div + div { margin-top: 8px; }
.card .more dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 2px 0 0; }
.card .more dt { color: var(--muted); }
.card .more dd { margin: 0; color: var(--text); }
.nw { white-space: nowrap; }
.card .more .none b { font-weight: 500; }
.ico { width: 18px; height: 18px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 600px) { .card .px { gap: 0 8px; font-size: 14px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>台服通貨價格<small id="league"></small></h1>
    <div class="rate"><span id="rate"></span><button class="theme" id="theme" type="button" role="switch"><span class="knob"></span><span class="ic sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></span><span class="ic moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg></span></button></div>
    <div class="stamp" id="stamp"></div>
    <div class="meta" id="meta"></div>
  </header>
  <div id="barTop"></div>
  <div class="bar" id="bar">
    <div class="search">
      <input id="q" type="search" placeholder="搜尋物品名稱（中文或英文）" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="清除搜尋文字" title="清除" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <!-- 手機往下滑後，篩選收成這顆按鈕；點開展開分類與顯示範圍 -->
    <button class="ftoggle" id="ftoggle" type="button" aria-expanded="false"></button>
    <div class="seg" id="only" role="group" aria-label="顯示範圍"></div>
    <div class="sorter">
      <label>排序 <select id="sortSel" aria-label="排序方式"></select></label>
      <label class="grpchk"><input type="checkbox" id="grouped"> 依小分類分組</label>
    </div>

  <main id="list"></main>
</div>
<div class="toast" id="toast"></div>
<!-- 每次開頁都帶時間參數，避免瀏覽器或 GitHub 快取給舊資料 -->
<script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>')</script>
<script>
let D = window.TW_DATA
const $ = id => document.getElementById(id)
let chaos, divine
const img = (it, cls = 'ico') => it?.icon ? `<img class="${cls}" src="${it.icon}" alt="" loading="lazy">` : ''
const fmt = n => n >= 100 ? Math.round(n).toLocaleString() : n >= 10 ? n.toFixed(1) : n >= 1 ? n.toFixed(2) : n.toPrecision(2)
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`)
const two = n => String(n).padStart(2, '0')
const hhmm = d => `${two(d.getHours())}:${two(d.getMinutes())}`
// 往前第 ago 個整點時段（0 = 資料時間），例：14:00–15:00
const span = ago => `${hhmm(new Date(D.updated - (ago + 1) * 3600e3))}–${hhmm(new Date(D.updated - ago * 3600e3))}`
// 放在網頁內容裡的時段，不讓它在「–」處斷行
const spanH = ago => `<span class="nw">${span(ago)}</span>`
// 月/日 時:分，例：11/22 19:00
const md = d => `${d.getMonth() + 1}/${d.getDate()} ${hhmm(d)}`
const day = d => `${d.getFullYear()}/${two(d.getMonth() + 1)}/${two(d.getDate())}（${'日一二三四五六'[d.getDay()]}）`
let cat = '所有'
const vol = it => (it.chaos?.vol24 ?? 0) + (it.divine?.vol24 ?? 0)
// 分類圖示：price.mjs 指定的代表圖，沒指定就用該分類成交量最大的物品；「所有」「熱門」不放圖
const catIcon = c => c === '所有' || c === '熱門' ? [] : D.catIcons[c] ?? [D.items.filter(i => i.cat === c && i.icon).sort((a, b) => vol(b) - vol(a))[0]?.icon].filter(Boolean)

// 資料時間：D.updated 是該小時的結束時間
function stamp() {
  const end = new Date(D.updated), start = new Date(D.updated - 3600e3), age = (Date.now() - D.updated) / 60e3
  const old = age > 150
  $('stamp').className = 'stamp' + (old ? ' old' : '')
  // 官方在整點約 20 分後發布上一個整點時段 → 下一個時段（end ~ end+1h）約在 end+1h+20分 出現
  const next = new Date(D.updated + 3600e3 + 20 * 60e3)
  $('stamp').innerHTML = `<i class="dot"></i>資料時間 <b>${day(start)} ${hhmm(start)}–${hhmm(end)}</b>`
    + `<span>${old ? '⚠ 已超過 2 小時沒有新資料（可能是官方延遲或自動更新故障），價格可能已過時' : `此時段的成交彙總；下一個時段（${hhmm(end)}–${hhmm(new Date(D.updated + 3600e3))}）預計 ${hhmm(next)} 後出現`}`
    + `${D.generated ? ` · 雲端抓取 ${hhmm(new Date(D.generated))}` : ''} · 本頁檢查 ${hhmm(new Date(lastCheck))}（每 2 分鐘自動檢查）</span>`
}
let lastCheck = Date.now() // 本頁最後一次檢查新資料的時間
function paint() {
  chaos = D.items.find(i => i.en === 'Chaos Orb'); divine = D.items.find(i => i.en === 'Divine Orb')
  $('league').textContent = D.league
  $('rate').innerHTML = `<span class="pair">${img(divine)} 1 = <b>${fmt(D.divinePrice)}</b> ${img(chaos)}</span><small>${span(0)} 成交區間 ${fmt(D.divineRange[0])}～${fmt(D.divineRange[1])}</small>`
  $('meta').textContent = `價格是遊戲內通貨交換的實際成交均價，混沌石價和神聖石價各自來自實際成交，不互相換算。`
    + `價格呈灰色：成交時段早於資料時間，點開可看是哪個時段。「售完」：資料時間內沒有人在賣。「無成交」：${D.hours} 小時內沒有成交，因此沒有價格。分類與順序與遊戲相同。`
  const chips = ['所有', '熱門', ...D.cats]
  if (!chips.includes(cat)) cat = '所有'
  $('chips').innerHTML = chips.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}"><span class="ic">${catIcon(c).map(src => `<img src="${src}" alt="">`).join('')}</span>${esc(c)}</button>`).join('')
  stamp()
}
$('chips').onclick = e => { const t = e.target.closest('.chip'); if (t) { cat = t.dataset.cat; for (const b of $('chips').children) b.setAttribute('aria-pressed', b === t); render(); picked() } }
// 自動更新：每 2 分鐘重新載入 data.js（GitHub 雲端每 20 分鐘重新產生）。
// 用「產生時間」比對：同一小時但內容改過（例如版面更新）也會換上；有新的小時才跳提示
function poll() {
  const s = document.createElement('script')
  s.src = 'data.js?t=' + Date.now()
  s.onload = () => {
    s.remove()
    lastCheck = Date.now()
    const N = window.TW_DATA
    if (N && (N.generated !== D.generated || N.updated !== D.updated)) {
      const newHour = N.updated !== D.updated, y = scrollY
      D = N; paint(); render(); scrollTo(0, y)
      if (newHour) {
        $('toast').textContent = `已更新到 ${hhmm(new Date(D.updated - 3600e3))}–${hhmm(new Date(D.updated))} 的資料`
        $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 4000)
      }
    } else stamp()
  }
  s.onerror = () => s.remove()
  document.head.append(s)
}
setInterval(poll, 120e3)
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll() })
// 搜尋：有文字才顯示 ✕；按 ✕ 清空並把游標留在搜尋框
$('q').oninput = () => { $('clear').hidden = !$('q').value; render() }
$('clear').onclick = () => { $('q').value = ''; $('clear').hidden = true; render(); $('q').focus() }

// 手機：篩選列在頁首捲出畫面後變成精簡列（搜尋框＋篩選按鈕）固定在上方；點按鈕展開，選完自動收起並回到清單開頭
const mobile = matchMedia('(max-width: 600px)')
function compactCheck() {
  const compact = mobile.matches && $('barTop').getBoundingClientRect().top < 0 // 篩選列原本的位置已捲出畫面
  if (compact === $('bar').classList.contains('compact')) return
  $('bar').classList.toggle('compact', compact)
  if (!compact) setOpen(false)
}
addEventListener('scroll', compactCheck, { passive: true })
mobile.addEventListener('change', compactCheck)
function setOpen(open) { $('bar').classList.toggle('open', open); $('ftoggle').setAttribute('aria-expanded', String(open)); ftoggleText() }
const ftoggleText = () => { $('ftoggle').textContent = `${cat}・${MODES[mode]}${SORT_SHORT[sortMode] ? '・' + SORT_SHORT[sortMode] : ''} ${$('bar').classList.contains('open') ? '▴' : '▾'}` }
$('ftoggle').onclick = () => setOpen(!$('bar').classList.contains('open'))
function picked() {
  if (!$('bar').classList.contains('open')) return
  setOpen(false)
  scrollTo({ top: $('list').getBoundingClientRect().top + scrollY - $('bar').offsetHeight - 8 })
}
// 顯示範圍：全部（照遊戲完整列出）／有成交價（24 小時內有成交）／近 1 小時在售（有成交價，且資料時間內有人在賣；不保證現在仍有貨）；記住選擇
const MODES = { all: '全部', traded: '有成交價', buyable: '近 1 小時在售' }
const buyable = it => !it.noTrade && [it.chaos, it.divine].some(q => q && !q.soldOut)
const inMode = (it, m) => m === 'all' || (m === 'traded' ? !it.noTrade : buyable(it))
let mode = 'all'
try { mode = MODES[localStorage.getItem('mode')] ? localStorage.getItem('mode') : 'all' } catch {}
const segPaint = (items = D.items) => { // 數字 = 目前分類／搜尋範圍內各模式的數量
  $('only').innerHTML = Object.entries(MODES).map(([k, label]) =>
    `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${label}<small>${items.filter(i => inMode(i, k)).length}</small></button>`).join('')
}
$('only').onclick = e => {
  const b = e.target.closest('button'); if (!b) return
  mode = b.dataset.mode; render(); picked()
  try { localStorage.setItem('mode', mode) } catch {}
}
document.addEventListener('toggle', e => { if (e.target.open) for (const d of document.querySelectorAll('details.card[open]')) if (d !== e.target) d.open = false }, true)
document.addEventListener('click', e => { if (!e.target.closest('details.card')) for (const d of document.querySelectorAll('details.card[open]')) d.open = false })

const unit = { get chaos() { return ['混沌石', chaos] }, get divine() { return ['神聖石', divine] } }
const range = ([a, b]) => a === b ? fmt(a) : `${fmt(a)}～${fmt(b)}`
const num = ([a, b]) => a === b ? a.toLocaleString() : `${a.toLocaleString()}～${b.toLocaleString()}`
// 卡片上只放價格；比例、成交量、在售量收在展開區
const px = (q, k) => q ? `<span class="${q.soldOut ? 'out' : q.ago ? 'stale' : ''}" title="${unit[k][0]}價${q.soldOut ? `（${span(0)} 沒有人在賣）` : q.ago ? `（${span(q.ago)} 的成交）` : ''}">${img(unit[k][1])}${fmt(q.price)}</span>` : `<span class="na" title="24 小時內沒有${unit[k][0]}成交">${img(unit[k][1])}—</span>`
// 展開區：每種通貨一個小表格（均價／區間／成交／在售）。
// 均價、區間、成交量來自「最近一次有成交的時段」（可能早於資料時間）；在售是資料時間的狀況，各自標出時段。
// 不到 1 個通貨的物品寫成「1 混沌石 = N 個」，不用自己換算
const detail = (q, k, it) => {
  const [u] = unit[k]
  if (!q) return it === unit[k][1] ? '' : `<div class="none"><b>${u}價</b>：24 小時內沒有成交</div>`
  const cheap = q.price < 1
  const avg = cheap ? `1 ${u} = ${fmt(1 / q.price)} 個` : `1 個 = ${fmt(q.price)} ${u}`
  const rng = cheap ? `1 ${u} = ${range([1 / q.range[1], 1 / q.range[0]])} 個` : `${range(q.range)} ${u}`
  const stock = q.soldOut ? `<span class="warn">0 個（${spanH(0)} 沒有人在賣）</span>`
    : q.stock[0] === q.stock[1] ? `${num(q.stock)} 個（${spanH(0)}）` : `${num(q.stock)} 個（${spanH(0)} 期間最少～最多）`
  return `<div><b>${u}價</b><dl><dt>均價</dt><dd>${avg}</dd><dt>區間</dt><dd>${rng}</dd>`
    + `<dt>成交</dt><dd>${q.vol[0].toLocaleString()} 個（${spanH(q.ago)}）</dd><dt>在售</dt><dd>${stock}</dd></dl></div>`
}
const key = it => it.noTrade ? -1 : it.chaos?.price ?? it.divine.price * D.divinePrice // 只用來排序，無成交排最後
const soldOut = it => !it.noTrade && [it.chaos, it.divine].filter(Boolean).every(q => q.soldOut)
// 24 小時沒有成交的物品：照遊戲位置顯示，但沒有價格（官方資料沒有成交價，不做推算）
//   有人在賣（listing）的顯示在售數量：買得到，但要進遊戲看開價
const stockText = it => [['chaos', '混沌石'], ['divine', '神聖石']].filter(([k]) => it.listing[k]).map(([k, u]) => `用${u}交易 ${num(it.listing[k])} 個`).join('、')
const noTradeCard = it => `<details class="card notrade${it.listing ? ' listed' : ''}">
      <summary>${img(it, '')}<div class="nm" title="${esc(it.name)}">${esc(it.name)}</div><div class="px"><span class="na">${it.listing ? `在售 ${Math.max(...Object.values(it.listing).filter(Boolean).map(s => s[1])).toLocaleString()}・無成交價` : '24 小時無成交'}</span></div></summary>
      <div class="more"><div>${esc(it.en ?? '')}</div><div>${it.listing
        ? `<dl><dt>在售</dt><dd>${stockText(it)}（${spanH(0)}）</dd><dt>成交</dt><dd>24 小時內沒有成交</dd></dl>官方資料只有成交價、沒有掛單開價，開價請進遊戲的通貨交換查看。`
        : '24 小時內在通貨交換沒有任何成交。官方資料只提供成交價，因此沒有價格可顯示。'}</div></div></details>`
const card = it => it.noTrade ? noTradeCard(it) : `<details class="card${soldOut(it) ? ' soldout' : ''}">
      <summary>${img(it, '')}<div class="nm" title="${esc(it.name)}">${esc(it.name)}${soldOut(it) ? '<span class="tag">售完</span>' : ''}</div><div class="px">${px(it.chaos, 'chaos')}${px(it.divine, 'divine')}</div></summary>
      <div class="more"><div>${esc(it.en ?? '')}</div>${detail(it.chaos, 'chaos', it)}${detail(it.divine, 'divine', it)}</div></details>`
const grid = rows => `<div class="grid">${rows.map(card).join('')}</div>`
// 排序（篩選列上一個共用選單，套用到目前看到的全部內容）＋「依小分類分組」開關，都記住選擇。
// 沒有該種價格的物品永遠排最後；價格相同或沒價格時保持遊戲順序
const SORTS = [['game', '遊戲順序'], ['c-desc', '混沌石 高→低'], ['c-asc', '混沌石 低→高'], ['d-desc', '神聖石 高→低'], ['d-asc', '神聖石 低→高']]
const SORT_SHORT = { 'c-desc': '混沌↓', 'c-asc': '混沌↑', 'd-desc': '神聖↓', 'd-asc': '神聖↑' }
let sortMode = 'game', grouped = true
try { if (SORT_SHORT[localStorage.getItem('sortMode')]) sortMode = localStorage.getItem('sortMode'); grouped = localStorage.getItem('grouped') !== '0' } catch {}
$('sortSel').innerHTML = SORTS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')
$('sortSel').value = sortMode
$('grouped').checked = grouped
$('sortSel').onchange = () => { sortMode = $('sortSel').value; render(); try { localStorage.setItem('sortMode', sortMode) } catch {} }
$('grouped').onchange = () => { grouped = $('grouped').checked; render(); try { localStorage.setItem('grouped', grouped ? '1' : '0') } catch {} }
function applySort(rows) {
  if (sortMode === 'game') return rows
  const [c, dir] = sortMode.split('-'), p = it => (c === 'c' ? it.chaos : it.divine)?.price
  return [...rows].sort((a, b) => {
    const x = p(a), y = p(b)
    if (x == null || y == null) return (x == null) - (y == null)
    return dir === 'desc' ? y - x : x - y
  })
}
const section = (title, rows) => rows.length ? `<section><h2>${esc(title)}<span>${rows.length} 種</span></h2>${grid(applySort(rows))}</section>` : ''
// 有遊戲版面的分頁：分組開＝照遊戲的小分組（組內套用排序）；分組關＝整個分類一起排（先照遊戲順序，再套用排序）
function tab(c, rows) {
  if (!rows.length) return ''
  const gs = D.groups[c]
  if (!gs) return section(c, rows.sort((a, b) => key(b) - key(a)))
  const head = `<h2>${esc(c)}<span>${rows.length} 種</span></h2>`
  const gi = g => g == null ? gs.length : gs.indexOf(g)
  if (!grouped) {
    const flat = [...rows].sort((a, b) => gi(a.group) - gi(b.group) || (a.ord ?? 0) - (b.ord ?? 0))
    return `<section>${head}${grid(applySort(flat))}</section>`
  }
  const single = gs.length === 1 && rows.every(i => i.group === gs[0]) // 只有一個小分類：不重複顯示小分類標題
  const parts = [...gs, null].map(g => {
    const r = applySort(rows.filter(i => (i.group ?? null) === g).sort((a, b) => g ? a.ord - b.ord : key(b) - key(a)))
    return r.length ? `<div class="grp" style="--n:${r.length}">${single ? '' : `<h3>${esc(g ?? '其他')}<small>${r.length}</small></h3>`}${grid(r)}</div>` : ''
  }).join('')
  return `<section>${head}<div class="grps">${parts}</div></section>`
}
// 目前分類＋搜尋字範圍內的物品（顯示範圍按鈕的數字也用它算）
// 熱門的計算範圍：近 1 小時（預設，最貼近目前市場）／近 24 小時（主流、較穩定）；記住選擇
let hotRange = 'h1'
try { if (localStorage.getItem('hotRange') === 'h24') hotRange = 'h24' } catch {}
const hotSeg = () => `<div class="seg hotseg" role="group" aria-label="熱門計算範圍">${[['h1', '近 1 小時'], ['h24', '近 24 小時']].map(([k, l]) => `<button type="button" data-hot="${k}" aria-pressed="${k === hotRange}">${l}</button>`).join('')}</div>`
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-hot]'); if (!b) return
  hotRange = b.dataset.hot; render()
  try { localStorage.setItem('hotRange', hotRange) } catch {}
})
function scope() {
  const q = $('q').value.trim().toLowerCase()
  const match = it => !q || it.name.toLowerCase().includes(q) || it.en?.toLowerCase().includes(q)
  const byId = new Map(D.items.map(i => [i.id, i]))
  const base = cat === '熱門' ? (hotRange === 'h1' ? D.hot1 ?? D.hot : D.hot).map(id => byId.get(id)).filter(Boolean)
    : D.items.filter(i => cat === '所有' ? D.cats.includes(i.cat) : i.cat === cat)
  return base.filter(match)
}
function render() {
  const items = scope(), shown = items.filter(it => inMode(it, mode))
  const html = cat === '熱門'
    ? hotSeg() + section(hotRange === 'h1'
      ? `熱門：${md(new Date(D.updated - 3600e3))}–${hhmm(new Date(D.updated))} 這 1 小時成交總值前 30 名（每小時更新）`
      : `熱門：${md(new Date(D.updated - 24 * 3600e3))}–${md(new Date(D.updated))} 這 24 小時成交總值前 30 名（每小時隨新資料重新排名）`, shown)
    : D.cats.filter(c => cat === '所有' || c === cat).map(c => tab(c, shown.filter(i => i.cat === c))).join('')
  $('list').innerHTML = html || '<p class="empty">找不到符合的物品</p>'
  segPaint(items)
  $('sortSel').options[0].text = cat === '熱門' ? '排名順序' : '遊戲順序'
  $('grouped').disabled = cat === '熱門'
  ftoggleText()
  fit()
}
// 依清單寬度算出欄數與欄寬（卡片最小 200px，手機 150px），所有分組共用 → 上下對齊
function fit() {
  const w = $('list').clientWidth, gap = 8, min = innerWidth <= 600 ? 150 : 200
  const cols = Math.max(1, Math.floor((w + gap) / (min + gap)))
  document.documentElement.style.setProperty('--cw', Math.floor((w - gap * (cols - 1)) / cols * 100) / 100 + 'px')
  for (const g of document.querySelectorAll('.grp')) g.style.setProperty('--k', Math.min(+g.style.getPropertyValue('--n'), cols)) // 每組佔幾欄
}
// 開關沒有文字，用 aria 屬性告訴讀屏軟體目前狀態與作用
const themeBtn = () => {
  const light = document.documentElement.dataset.theme === 'light'
  $('theme').setAttribute('aria-checked', String(!light))
  $('theme').setAttribute('aria-label', light ? '目前淺色，切換為深色' : '目前深色，切換為淺色')
  $('theme').title = light ? '切換為深色' : '切換為淺色'
}
$('theme').onclick = () => {
  const light = document.documentElement.dataset.theme !== 'light'
  if (light) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme
  try { localStorage.setItem('theme', light ? 'light' : 'dark') } catch {}
  themeBtn()
}
themeBtn()
paint()
new ResizeObserver(fit).observe($('list')) // 視窗縮放、捲軸出現或消失都會重算
render()
</script>
</body>
</html>
