# 每 20 分鐘（每小時 :07 :27 :47）抓台服通貨交換的官方每小時資料，產生頁面並發布到 GitHub Pages
# （官方整點約 20 分後才發布上一小時）
#
# 觸發方式有兩種，互為備援：
#   1. GitHub 排程（cron）—— GitHub 不保證準時，新 repo 常常好幾小時都不觸發
#   2. 接力：每次執行完，等到下一個 :07/:27/:47 再觸發下一次（GitHub 允許用內建臨時權杖觸發 workflow_dispatch，不需任何金鑰）
#      同時有多條接力時只由最新的一條觸發，其餘自動停下，最後永遠只剩一條
# 要停止自動更新：到 repo 的 Actions → update-prices → 右上「⋯」→ Disable workflow
name: update-prices

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # 同一時間只部署一次；排隊等待，不取消進行中的部署
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 過去的小時資料不會變，快取起來每次只需抓新的那一兩小時
      - uses: actions/cache@v4
        with:
          path: cache
          key: tw-cache-${{ github.run_id }}
          restore-keys: tw-cache-
      - run: node price.mjs --no-open
      # 小程式：原始碼與編好的 exe 都在 app/（exe 由 app/build-exe.cmd 以 Windows 內建編譯器產生）
      # app-version.json：小程式的自動更新會讀它（版本號取自原始碼的 Version 常數，校驗碼由 exe 算出，簽章由發布者本機產生）
      - run: |
          mkdir _site && cp index.html data.js filter.html filter.js app/TwPriceOverlay.exe _site/
          (cd app && zip -q -X ../_site/TwPriceOverlay.zip TwPriceOverlay.exe 使用說明.txt)
          ver=$(sed -n 's/.*const string Version = "\([^"]*\)".*/\1/p' app/TwPriceOverlay.cs)
          sha=$(sha256sum app/TwPriceOverlay.exe | cut -d' ' -f1)
          # sig：發布者在自己電腦上用私鑰簽署（app/sign-exe.ps1），小程式用內建公鑰驗證；雲端只負責轉貼，碰不到私鑰
          sig=$(cat app/TwPriceOverlay.exe.sig)
          echo "{\"version\":\"$ver\",\"sha256\":\"$sha\",\"sig\":\"$sig\"}" > _site/app-version.json
          cat _site/app-version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 連續推送時，前一次部署可能還沒結束就撞到而失敗；失敗就等 60 秒重試一次
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # 公開 repo 60 天沒有活動，GitHub 會停用排程；每次執行時重新啟用一次
      - name: keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

  # 接力：部署完（成功或失敗都接），等到下一個 :07/:27/:47 觸發下一次
  next:
    needs: build-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: wait for next slot, then trigger the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          m=$(date -u +%-M); s=$(date -u +%-S)
          for t in 7 27 47 67; do [ "$m" -lt "$t" ] && break; done
          wait=$(( (t - m) * 60 - s ))
          [ "$wait" -lt 60 ] && wait=$(( wait + 1200 ))
          echo "等待 ${wait} 秒到下一個時間點"
          sleep "$wait"
          # 只由「最新」的那條接力觸發：若有比自己新、且還在排隊／進行中的執行，就交給它，自己停下。
          # （兩條接力同時到點時，舊的會讓給新的，不會兩邊都停、也不會變成兩條）
          newer=$(gh run list --workflow update.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId > ${{ github.run_id }} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "$newer" = "0" ]; then
            gh workflow run update.yml --ref main
            echo "已觸發下一次執行"
          else
            echo "有 ${newer} 個較新的執行在進行，由它接力，這裡不觸發"
          fi
